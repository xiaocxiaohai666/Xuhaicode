# ============================================
# chat_room_online Redis 连接配置
# 格式：key=value，一行一条，# 开头为注释
# 注意：等号两边不要加空格，值不要加引号
# 键名与 Redis_client 的 Options 字段一一对应
# ============================================

# Redis 服务地址
host=127.0.0.1

# Redis 服务端口
port=6379

# 建连超时（毫秒）。必须配置成较短的值，网络异常时快速失败，避免阻塞 IO 线程
connect_timeout_ms=200

# 接收循环的唤醒粒度（毫秒）；越小订阅生效越快，登录后空窗也越小
poll_ms=20

# 断线重连间隔（毫秒）
retry_ms=1000
