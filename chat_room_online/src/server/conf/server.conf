# ============================================
# chat_room_online 服务端监听配置
# 格式：key=value，一行一条，# 开头为注释
# 注意：等号两边不要加空格，值不要加引号
# ============================================

# 监听地址，0.0.0.0 表示本机所有网卡
ip=0.0.0.0

# 监听端口，必须与 client 的 client.conf 保持一致
port=6000

# IO 线程数；db.conf 的 pool_size 必须大于等于 threads + 1
threads=16
