# ============================================
# chat_room_online 数据库连接配置
# 格式：key=value，一行一条，# 开头为注释
# 注意：等号两边不要加空格，值不要加引号
# ============================================

# MySQL 服务地址
ip=127.0.0.1

# MySQL 服务端口
port=3306

# 数据库名（聊天室业务库）
name=chat_room_db

# 登录账号
user=root

# 登录密码
passwd=111111

# 字符集，避免中文昵称/聊天内容乱码
charset=utf8mb4

# 连接池容量，必须 >= 工作线程数
# 设计约定：一条连接只对应一个固定线程 id，不可更改
pool_size=10
