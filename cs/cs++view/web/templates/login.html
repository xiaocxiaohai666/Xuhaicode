<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约系统 · 登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>预约系统</h1>
      <p>请登录或注册后进入</p>
    </div>

    <!-- 标签切换 -->
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="login">登录</button>
      <button type="button" class="tab-btn" data-tab="register">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="login-form" class="auth-form active" autocomplete="off">
      <label>手机号
        <input type="text" name="user_tel" placeholder="11 位手机号" required>
      </label>
      <label>用户名
        <input type="text" name="user_name" placeholder="用户名" required>
      </label>
      <label>密码
        <input type="password" name="passwd" placeholder="密码" required>
      </label>
      <button type="submit" class="btn-primary">登录</button>
    </form>

    <!-- 注册表单 -->
    <form id="register-form" class="auth-form" autocomplete="off">
      <label>手机号
        <input type="text" name="user_tel" placeholder="11 位手机号" required>
      </label>
      <label>用户名
        <input type="text" name="user_name" placeholder="用户名" required>
      </label>
      <label>密码
        <input type="password" name="passwd" placeholder="密码（≥4 位）" required>
      </label>
      <button type="submit" class="btn-primary">注册</button>
    </form>

    <div id="auth-msg" class="auth-msg"></div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
